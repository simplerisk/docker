ignore:
  - vulnerability: CVE-2025-27558 # Not able to fix it at the moment
  # False positive: Grype's binary classifier reads the PHP interpreter's own version
  # string (embedded in /usr/local/bin/php, libphp.so, and the bundled extensions such
  # as curl.so) as a "curl" binary, then flags these curl CVEs (all fixed in curl
  # 8.21.0). The REAL curl is the Debian package, patched (8.14.1-2+deb13u4) and
  # correctly not flagged. Scoped per-CVE to binary-classified curl so a genuine future
  # curl finding still surfaces instead of being blanket-ignored.
  - vulnerability: CVE-2026-11856
    package:
      name: curl
      type: binary
  - vulnerability: CVE-2026-10536
    package:
      name: curl
      type: binary
  - vulnerability: CVE-2026-8927
    package:
      name: curl
      type: binary
  - vulnerability: CVE-2026-8924
    package:
      name: curl
      type: binary
  # Same binary-classifier false positive as above, newly published CVE IDs.
  # Verified against simplerisk-minimal (php 8.3/8.4/8.5): the only "curl"
  # match is /usr/local/lib/php/extensions/.../curl.so reporting the PHP
  # version (e.g. 8.5.10) as its own. The real Debian curl package
  # (8.14.1-2+deb13u5) is also affected but Debian's tracker marks both IDs
  # "wont-fix", so --only-fixed already excludes that (legitimate) match on
  # its own; only the misclassified binary match needs ignoring here.
  - vulnerability: CVE-2026-19931
    package:
      name: curl
      type: binary
  - vulnerability: CVE-2026-18924
    package:
      name: curl
      type: binary
