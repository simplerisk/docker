ignore:
  - vulnerability: CVE-2025-27558 # Not able to fix it at the moment
  # False positive: Grype's binary classifier reads the PHP interpreter's own version
  # string (embedded in /usr/local/bin/php, libphp.so, and the bundled extensions such
  # as curl.so) as a "curl" binary, then flags every curl CVE fixed after that number
  # (PHP 8.5.x is read as "curl 8.5.x"). The REAL curl is the Debian package
  # (8.14.1-x), which grype scans separately as a deb. Scoped by package + location
  # instead of per-CVE, so new curl CVEs no longer need a new entry each; a curl found
  # anywhere outside PHP's extension directory (or as a deb) still surfaces.
  - package:
      name: curl
      type: binary
      location: "/usr/local/lib/php/extensions/**"
  # False positive: the swagger-api/swagger-ui Composer package ships a release-script
  # template at swagger-ui-dist-package/package.json whose version is the literal
  # placeholder "$$VERSION". Grype cannot parse it, so it matches every swagger-ui-dist
  # advisory. Nothing loads this file; the UI actually served is vendor/.../dist/
  # (5.x, past the 4.1.3 fix).
  - package:
      name: swagger-ui-dist
      type: npm
      location: "/var/www/simplerisk/vendor/swagger-api/swagger-ui/swagger-ui-dist-package/**"
