name: Grype report
description: >
  Collect the grype-* artifacts of this run, write a one-row-per-image summary to the
  job log and step summary, and post one de-duplicated digest to Slack when any image
  has findings. Run it in a job with `if: always()` so a critical finding that failed a
  scan job is still reported. Needs a prior checkout of this repository.

inputs:
  results:
    description: Newline-separated <label>=<job-result> pairs, one per expected scan.
    required: true
  slack_webhook_url:
    description: Slack incoming webhook. When empty, the Slack post is skipped.
    required: false
    default: ''
  context:
    description: Text shown in the Slack message (workflow name and branch).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download Grype reports
      uses: actions/download-artifact@v4
      with:
        pattern: grype-*
        path: grype-reports
      # A scan that never produced a report has no artifact; the summary reports that
      # as "did not complete" rather than failing here.
      continue-on-error: true
    - name: Summarize scan results
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        mkdir -p grype-reports
        mapfile -t pairs < <(printf '%s\n' "$RESULTS" | sed '/^[[:space:]]*$/d')
        "${{ github.action_path }}/../../scripts/grype-scan-summary.sh" grype-reports "${pairs[@]}" \
          | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Post digest to Slack
      if: ${{ inputs.slack_webhook_url != '' }}
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REF: ${{ inputs.context }}
      run: |
        payload="$("${{ github.action_path }}/../../scripts/grype-slack-digest.sh" grype-reports)"
        if [ -z "$payload" ]; then
          echo "No Grype findings in any image; nothing to post."
          exit 0
        fi
        curl -sSf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
    - name: Note skipped Slack post
      if: ${{ inputs.slack_webhook_url == '' }}
      shell: bash
      run: echo "::notice::No Slack webhook available (secret unset, or a fork PR); skipping the Slack digest."
