name: Publish testing images + promote

# Publishes the TESTING-channel SimpleRisk images and promotes the minimal one
# into the dedicated-hosting (customers-cdk) account so tier=testing customers
# auto-update.
#
# Trigger: a push to this repo's `testing` branch (code-development mirrors the
# current testing version here on each testing publish — see the code-development
# `sync_docker_testing` workflow), or a manual dispatch.
#
# Build: the CURRENT testing bundle from bundles-test (the built testing-branch
# code) + the database/master schema, via `generate_dockerfile.sh "$VERSION"
# context` (COPYs the app from the assembled context, real `ENV version`) — the
# same recipe the code-development `test_docker_deploy` smoke uses, but pushed
# to Docker Hub.
#
# The minimal image is built NATIVELY per architecture: a matrix of
# {php83, php84, php85} x {amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm}
# pushes each by digest, then merge-minimal stitches the two digests of each PHP
# variant into one multi-arch tag with `docker buildx imagetools create`. The
# arm64 half used to be QEMU-emulated in one job (about 27 min per variant, 88 min
# total, 24 of every 27 minutes being the PHP extension compile); natively it is
# about the amd64 time (about 2.5 min of build work per variant). The published
# tags, their multi-arch shape (amd64 + arm64 + attestations), the Grype gate and
# the single SSM promote are unchanged.
#
# Dry run: dispatch this workflow from `testing` with dry_run=true to build,
# merge and scan under <VERSION>-nativetest-php8x tags. It moves no real tag (no
# bare <VERSION>, no :testing) and does not promote. The `testing` environment
# only admits the `testing` branch, so a dry run cannot be dispatched from a
# feature branch.
#
# Tags (see design code-development docs/superpowers/specs/2026-07-10-release-image-
# promotion-design): every release image is built ONCE here from the testing
# bundle and later PROMOTED (not rebuilt) to prod by promote-latest.yml on
# master, which retags these same digests. Nothing is rebuilt at GA.
#
#   simplerisk/simplerisk-minimal  <VERSION>-php83/-php84/-php85, bare <VERSION>
#                                  (= php85, the default), and :testing
#   simplerisk/simplerisk          <VERSION>-jammy/-noble, bare <VERSION>
#                                  (= noble, the default), and :testing
#
# There is NO <VERSION>-testing tag. The floating :latest and the prod SSM tier
# are moved only by the GA promote.
#
# Promote: writes SSM /simplerisk/customers/image-tag/testing = <VERSION>-php85
# in the customers account via OIDC; the image-updater Lambda there rolls every
# tier=testing service (new image + fresh extras together). The full-stack image
# is not part of the managed fleet, so it has no SSM tier.

on:
  push:
    branches: [testing]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Build, merge and scan under <VERSION>-nativetest-php8x tags only: no bare
          <VERSION>, no :testing, no SSM promote.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # OIDC: assume the cross-account image-tag promoter role

concurrency:
  group: publish-testing
  cancel-in-progress: false

env:
  IMAGE_NAME: simplerisk/simplerisk-minimal
  FULL_IMAGE_NAME: simplerisk/simplerisk
  AWS_REGION: us-east-1
  SSM_PARAM: /simplerisk/customers/image-tag/testing

jobs:
  # Resolve the version ONCE so both publish jobs stamp the same release, even
  # if the testing channel rotates mid-run. Each publish job then fetches that
  # exact bundle by name and verifies its hash independently.
  resolve:
    name: Resolve the current testing version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      # "" for a real publish, "-nativetest" for a dry run: tags are
      # <VERSION><infix>-php8x, so a dry run can never collide with a real tag.
      infix: ${{ steps.ver.outputs.infix }}
      dry_run: ${{ steps.ver.outputs.dry_run }}
    steps:
      - name: Derive VERSION from the testing channel
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        id: ver
        run: |
          set -euo pipefail
          # The testing channel keeps exactly one current bundle; list it and
          # derive VERSION from its name (self-sufficient — no version file needed
          # in this repo). `|| true` so a zero-match reaches the COUNT guard.
          BUNDLE=$(curl -fsSL "https://bundles-test.simplerisk.com/?list-type=2" \
            | grep -oE 'simplerisk-[0-9]{8}-[0-9]{3}\.tgz' | sort -u || true)
          COUNT=$(printf '%s\n' "$BUNDLE" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::expected exactly one testing bundle, found $COUNT: [$BUNDLE]"; exit 1
          fi
          VERSION=$(printf '%s' "$BUNDLE" | sed -n 's/^simplerisk-\([0-9]\{8\}-[0-9]\{3\}\)\.tgz$/\1/p')
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]{8}-[0-9]{3}$'; then
            echo "::error::could not derive VERSION from bundle '$BUNDLE'"; exit 1
          fi
          echo "testing bundle: $BUNDLE (version $VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "infix=-nativetest" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DRY RUN: tags will be ${VERSION}-nativetest-php8x; no real tag moves and nothing is promoted"
          else
            echo "infix=" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  # One leg per {PHP variant} x {architecture}, each on a runner of that architecture, so
  # nothing is emulated. Each leg pushes its image BY DIGEST (no tag) and uploads the digest;
  # merge-minimal below turns the two digests of a variant into the multi-arch tag.
  build-minimal:
    name: Build minimal php${{ matrix.php }} ${{ matrix.arch }}
    needs: resolve
    environment: testing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One failed leg means there is no complete release; do not spend the rest.
      fail-fast: true
      matrix:
        php: ['83', '84', '85']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (docker@testing)
        uses: actions/checkout@v6

      - name: Fetch + verify the testing bundle and schema
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/testing-bundle.tgz \
            "https://bundles-test.simplerisk.com/simplerisk-${VERSION}.tgz"
          # Integrity: verify the bundle against the sha256 published in the served
          # updates-test feed (publish-bundle writes the hash on the same push).
          # VERSION is regex-guarded upstream, so it is safe in the sed pattern.
          EXPECTED_SHA=$(curl -fsSL "https://updates-test.simplerisk.com/releases.xml" \
            | sed -n "/<release version=\"${VERSION}\">/,/<\/release>/p" \
            | grep -oE '<bundle_sha256>[a-f0-9]{64}</bundle_sha256>' | head -1 | grep -oE '[a-f0-9]{64}')
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::no bundle_sha256 for $VERSION in updates-test releases.xml"; exit 1
          fi
          ACTUAL_SHA=$(sha256sum /tmp/testing-bundle.tgz | cut -d' ' -f1)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::bundle sha256 mismatch for $VERSION (expected $EXPECTED_SHA, got $ACTUAL_SHA)"; exit 1
          fi
          echo "bundle sha256 verified"
          SQL_URL="https://raw.githubusercontent.com/simplerisk/database/master/simplerisk-en-${VERSION}.sql"
          curl -fsSL -o /tmp/testing.sql "$SQL_URL" \
            || { echo "::error::release schema not found on database/master: $SQL_URL"; exit 1; }

      - name: Assemble the testing build context
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd simplerisk-minimal
          # generate_dockerfile.sh "$VERSION" context -> a Dockerfile that COPYs
          # simplerisk/ (app) + common/simplerisk.sql (schema) from this context,
          # with a real `ENV version=$VERSION` (no literal "testing").
          ./generate_dockerfile.sh "$VERSION" context
          tar xzf /tmp/testing-bundle.tgz -C .
          cp /tmp/testing.sql common/simplerisk.sql
          test -d simplerisk || { echo "::error::bundle did not extract a simplerisk/ dir"; exit 1; }

      # No QEMU: this leg builds only its own architecture, on a runner of that architecture.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Derive the PHP version (8.3 from 83)
        id: php
        env:
          PHP: ${{ matrix.php }}
        run: echo "version=${PHP:0:1}.${PHP:1}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest — php${{ matrix.php }} ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: simplerisk-minimal
          file: simplerisk-minimal/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: php_version=${{ steps.php.outputs.version }}
          # No tag: the digest is merged into the tags by merge-minimal.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=minimal-testing-php${{ matrix.php }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=minimal-testing-php${{ matrix.php }}-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$DIGEST" | grep -qE '^sha256:[a-f0-9]{64}$' \
            || { echo "::error::build produced no image digest (got '$DIGEST')"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-php${{ matrix.php }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the amd64 and arm64 digests of each PHP variant into the published tags.
  merge-minimal:
    name: Merge minimal php${{ matrix.php }} (amd64 + arm64)
    needs: [resolve, build-minimal]
    environment: testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        php: ['83', '84', '85']
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-php${{ matrix.php }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create the multi-arch tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          INFIX: ${{ needs.resolve.outputs.infix }}
          PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          mapfile -t digests < <(ls)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::php${PHP}: expected 2 digests (amd64, arm64), found ${#digests[@]}: ${digests[*]:-none}"; exit 1
          fi
          refs=()
          for d in "${digests[@]}"; do refs+=("${IMAGE_NAME}@sha256:${d}"); done

          # <VERSION>-php8x always; php85 (the default) also carries the bare <VERSION> and
          # :testing. A dry run (INFIX=-nativetest) never touches the bare tag or :testing.
          tags=("${IMAGE_NAME}:${VERSION}${INFIX}-php${PHP}")
          if [ "$PHP" = "85" ] && [ -z "$INFIX" ]; then
            tags+=("${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}:testing")
          fi
          args=(); for t in "${tags[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"

          # Do not publish a half-built release: every tag must carry BOTH architectures.
          for t in "${tags[@]}"; do
            plats=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[].platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | unique | join(",")')
            echo "$t -> $plats"
            [ "$plats" = "linux/amd64,linux/arm64" ] \
              || { echo "::error::$t is missing an architecture (got '$plats')"; exit 1; }
          done

  # Scan the images exactly as published, BEFORE the SSM promote rolls them out to
  # tier=testing customers. Every leg uploads its report; any critical finding fails the
  # leg, and promote needs all three legs, so a critical finding blocks the promote.
  scan-minimal:
    name: Scan minimal php${{ matrix.php }} (published)
    needs: [resolve, merge-minimal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['83', '84', '85']
    steps:
      - name: Checkout (docker@testing)
        uses: actions/checkout@v6
      - name: Scan php${{ matrix.php }} (published)
        uses: ./.github/actions/grype-scan
        with:
          image: ${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}${{ needs.resolve.outputs.infix }}-php${{ matrix.php }}
          label: published-minimal-php${{ matrix.php }}

  promote:
    name: Promote — SSM /image-tag/testing
    needs: [resolve, scan-minimal]
    # A dry run publishes under -nativetest tags only; nothing may roll out to tier=testing.
    if: ${{ needs.resolve.outputs.dry_run != 'true' }}
    environment: testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (OIDC → customers account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IMAGE_PROMOTER_TESTING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote — SSM /image-tag/testing = <VERSION>-php85
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "$SSM_PARAM" \
            --value "${VERSION}-php85" --type String --overwrite \
            --region "$AWS_REGION"
          echo "promoted $SSM_PARAM = ${VERSION}-php85" >> "$GITHUB_STEP_SUMMARY"

  # The full-stack image is built here for the same build-once reason as the
  # minimal one: GA promotes this digest rather than rebuilding from the prod
  # bundle. It is amd64-only, matching what the release build published before.
  publish-full:
    name: Publish simplerisk (full-stack) RC images
    needs: resolve
    environment: testing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout (docker@testing)
        uses: actions/checkout@v6

      - name: Fetch + verify the testing bundle and schema
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/testing-bundle.tgz \
            "https://bundles-test.simplerisk.com/simplerisk-${VERSION}.tgz"
          EXPECTED_SHA=$(curl -fsSL "https://updates-test.simplerisk.com/releases.xml" \
            | sed -n "/<release version=\"${VERSION}\">/,/<\/release>/p" \
            | grep -oE '<bundle_sha256>[a-f0-9]{64}</bundle_sha256>' | head -1 | grep -oE '[a-f0-9]{64}')
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::no bundle_sha256 for $VERSION in updates-test releases.xml"; exit 1
          fi
          ACTUAL_SHA=$(sha256sum /tmp/testing-bundle.tgz | cut -d' ' -f1)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::bundle sha256 mismatch for $VERSION (expected $EXPECTED_SHA, got $ACTUAL_SHA)"; exit 1
          fi
          echo "bundle sha256 verified"
          SQL_URL="https://raw.githubusercontent.com/simplerisk/database/master/simplerisk-en-${VERSION}.sql"
          curl -fsSL -o /tmp/testing.sql "$SQL_URL" \
            || { echo "::error::release schema not found on database/master: $SQL_URL"; exit 1; }

      - name: Assemble the testing build context
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd simplerisk
          # Same context recipe as the minimal image: COPY the app + schema from
          # the build context, with a real `ENV version=$VERSION`.
          ./generate_dockerfile.sh "$VERSION" context
          tar xzf /tmp/testing-bundle.tgz -C .
          cp /tmp/testing.sql common/simplerisk.sql
          test -d simplerisk || { echo "::error::bundle did not extract a simplerisk/ dir"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push jammy — <VERSION>-jammy
        uses: docker/build-push-action@v7
        with:
          context: simplerisk
          file: simplerisk/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: ubuntu_version_code=jammy
          tags: ${{ env.FULL_IMAGE_NAME }}:${{ needs.resolve.outputs.version }}-jammy
          cache-from: type=gha,scope=full-testing-jammy
          cache-to: type=gha,mode=max,scope=full-testing-jammy

      - name: Build and push noble (default) — <VERSION>-noble + <VERSION> + :testing
        uses: docker/build-push-action@v7
        with:
          context: simplerisk
          file: simplerisk/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: ubuntu_version_code=noble
          tags: |
            ${{ env.FULL_IMAGE_NAME }}:${{ needs.resolve.outputs.version }}-noble
            ${{ env.FULL_IMAGE_NAME }}:${{ needs.resolve.outputs.version }}
            ${{ env.FULL_IMAGE_NAME }}:testing
          cache-from: type=gha,scope=full-testing-noble
          cache-to: type=gha,mode=max,scope=full-testing-noble

      - name: Scan jammy (published)
        id: scanjammy
        continue-on-error: true
        uses: ./.github/actions/grype-scan
        with:
          image: ${{ env.FULL_IMAGE_NAME }}:${{ needs.resolve.outputs.version }}-jammy
          label: published-full-jammy
      - name: Scan noble (published)
        id: scannoble
        continue-on-error: true
        uses: ./.github/actions/grype-scan
        with:
          image: ${{ env.FULL_IMAGE_NAME }}:${{ needs.resolve.outputs.version }}-noble
          label: published-full-noble
      - name: Fail on critical findings
        if: ${{ steps.scanjammy.outcome == 'failure' || steps.scannoble.outcome == 'failure' }}
        run: |
          echo "::error::Grype found critical vulnerabilities in the published full-stack images."
          exit 1

  grype_report:
    name: Report Grype results for the published images
    # always(): a critical finding fails a publish job (and blocks the promote), and
    # that is exactly when the report matters.
    if: ${{ always() }}
    needs: [scan-minimal, publish-full]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (docker@testing)
        uses: actions/checkout@v6
      - name: Report Grype results
        uses: ./.github/actions/grype-report
        with:
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          context: ${{ github.workflow }} · ${{ github.ref_name }}
          results: |
            published-minimal-php83=${{ needs.scan-minimal.result }}
            published-minimal-php84=${{ needs.scan-minimal.result }}
            published-minimal-php85=${{ needs.scan-minimal.result }}
            published-full-jammy=${{ needs.publish-full.result }}
            published-full-noble=${{ needs.publish-full.result }}
