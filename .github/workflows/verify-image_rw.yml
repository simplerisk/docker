name: Full checkup for SimpleRisk Docker images

on:
  workflow_call:
    inputs:
      context_path:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      scan_label:
        required: true
        type: string
        description: Unique label for this scan; names the uploaded grype report artifact.
      image_tag:
        required: true
        type: string
      build_args:
        type: string

jobs:
  verify_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build Docker container
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.image_tag }}
          build-args: ${{ inputs.build_args || '' }}
      - name: Run linter with Dockle
        uses: erzz/dockle-action@v1
        with:
          image: ${{ inputs.image_tag }}
          failure-threshold: FATAL
          dockle-host: "unix:///var/run/docker.sock"
      - name: Scan vulnerabilities with Grype
        uses: ./.github/actions/grype-scan
        with:
          image: ${{ inputs.image_tag }}
          label: ${{ inputs.scan_label }}
