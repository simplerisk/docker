<IfModule mod_ssl.c>
<IfModule mod_headers.c>

SSLStrictSNIVHostCheck Off

<VirtualHost *:443>
        DocumentRoot /var/www/simplerisk
        <Directory "/var/www/simplerisk">
                AllowOverride all
                allow from all
                Options -Indexes
        </Directory>
        SSLEngine on
        SSLCertificateFile    /etc/apache2/ssl/ssl.crt/simplerisk.crt
        SSLCertificateKeyFile /etc/apache2/ssl/ssl.key/simplerisk.key
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SetEnvIf User-Agent ".*MSIE.*" nokeepalive ssl-unclean-shutdown
        CustomLog /var/log/apache2/ssl_request_log "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

        # SR-2589: the app (add_security_headers() in includes/functions.php) owns Referrer-Policy and sends
        # `origin`. A header set here with `always` is emitted in addition to the app's, giving two
        # conflicting values. setifempty only fills it in for responses the app did not set (static files).
        Header setifempty Referrer-Policy "origin"
        Header always unset X-Powered-By
        Header unset X-Powered-By
        Header always unset X-Generator
        Header unset X-Generator
</VirtualHost>

</IfModule>
